name: Release production
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: readukrainian-production
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check the selected commit
        run: npm run check
      - name: Verify deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Configure the production CLOUDFLARE_API_TOKEN secret.'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Configure CLOUDFLARE_ACCOUNT_ID.'; exit 1; }
      - name: Check live baseline and capture recovery information
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/prepare-release.mjs --remote
      - name: Retain recovery information before changing production
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: recovery-${{ github.sha }}-${{ github.run_attempt }}
          path: .local-release/recovery/*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Apply reviewed pending migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 migrations apply DB --remote
      - name: Deploy the checked commit
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy
      - name: Verify public content and version
        run: node scripts/check-live-content.mjs --deep --expect-version 0.83 --attempts 4
      - name: Verify live dictionary additions and repaired lookups
        run: node scripts/check-live-dictionary.mjs
