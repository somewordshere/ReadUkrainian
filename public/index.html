<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Історії українською</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="icon" href="./icons/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./css/styles.css" />
    <link rel="stylesheet" href="./css/public.css" />
    <link rel="preload" href="./fonts/literata/literata-cyrillic-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./fonts/literata/literata-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />

    <!-- script.js imports these, so without the hints the browser only learns
         they exist after script.js has downloaded, and each further level of
         the graph costs another round trip before the library can be fetched. -->
    <link rel="modulepreload" href="./js/app/content-api.js" />
    <link rel="modulepreload" href="./js/app/library-utils.mjs" />
    <link rel="modulepreload" href="./js/app/legacy-content.js" />
  </head>
  <body class="public-page library-page">
    <a class="skip-link" href="#mainContent">Перейти до бібліотеки</a>
    <div class="page-shell">
      <header class="hero">
        <div class="brand">
          <img class="brand-mark" src="./icon.svg" alt="" width="56" height="56" />
          <div>
            <p class="eyebrow">Читайте. Розумійте. Практикуйте.</p>
            <h1>Історії українською</h1>
          </div>
        </div>
        <p class="hero-copy">
          Читайте українською на різні теми.
        </p>
      </header>

      <main id="mainContent" tabindex="-1">
        <section class="continue-card" id="continueCard" aria-labelledby="continueTitle" hidden>
          <div>
            <p class="continue-kicker" id="continueKicker">Продовжити навчання</p>
            <h2 id="continueTitle"></h2>
            <p class="continue-meta" id="continueMeta"></p>
          </div>
          <a class="continue-link" id="continueLink" href="./story.html">Відкрити текст</a>
        </section>

        <section class="library-tools" id="libraryTools" aria-labelledby="libraryToolsTitle" hidden>
          <div class="library-tools-heading">
            <div>
              <h2 id="libraryToolsTitle">Бібліотека текстів</h2>
            </div>
            <button class="clear-filters-button" id="clearFiltersButton" type="button">Очистити фільтри</button>
          </div>
          <div class="library-controls">
            <label class="library-field library-search-field">
              <span class="visually-hidden">Пошук</span>
              <input id="storySearch" type="search" placeholder="Пошук: назва, тема або рівень" autocomplete="off" />
            </label>
            <div class="segmented status-filter" id="statusFilter" role="group" aria-label="Статус">
              <button class="segment" type="button" data-status="all" aria-pressed="true">Усі</button>
              <button class="segment" type="button" data-status="incomplete" aria-pressed="false">Незавершені</button>
              <button class="segment" type="button" data-status="completed" aria-pressed="false">Завершені</button>
              <button class="segment" type="button" data-status="bookmarked" aria-pressed="false">Закладки</button>
            </div>
            <div class="topic-chips" id="topicFilter" role="group" aria-label="Тема">
              <button class="chip" type="button" data-topic="all" aria-pressed="true">Усі теми</button>
            </div>
          </div>
          <p class="library-summary" id="librarySummary" aria-live="polite"></p>
        </section>

        <section class="library-state" id="libraryState" role="status" aria-live="polite">
          <p id="libraryStateMessage">Завантажуємо тексти…</p>
          <button class="retry-button" id="retryLibraryButton" type="button" hidden>Спробувати ще раз</button>
        </section>

        <section class="levels" id="levels" aria-busy="true" aria-label="Рівні та тексти"></section>

        <noscript>
          <p class="library-state">Для роботи бібліотеки потрібно увімкнути JavaScript.</p>
        </noscript>
      </main>
    </div>

    <script src="./js/app/progress.js"></script>
    <script src="./js/data/stories.js"></script>
    <script type="module" src="./js/app/script.js"></script>
    <script src="./js/app/version.js"></script>
  </body>
</html>
