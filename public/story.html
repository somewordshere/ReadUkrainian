<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Історії українською</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="icon" href="./icons/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./css/styles.css" />
    <link rel="stylesheet" href="./css/public.css" />
    <link rel="preload" href="./fonts/literata/literata-cyrillic-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./fonts/literata/literata-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />

    <!-- story.js imports these, so without the hints the browser only learns
         they exist after story.js has downloaded, and the story request cannot
         start until the whole graph has resolved. -->
    <link rel="modulepreload" href="./js/app/content-api.js" />
    <link rel="modulepreload" href="./js/app/legacy-content.js" />
    <link rel="modulepreload" href="./js/app/library-utils.mjs" />
    <link rel="modulepreload" href="./js/app/selection-speech.js" />
    <link rel="modulepreload" href="./js/app/story-words.mjs" />
  </head>
  <body class="public-page reader-page">
    <a class="skip-link" href="#storyTitle">Перейти до тексту</a>
    <div class="page-shell">
      <main class="story-layout">
        <a class="back-link" href="./index.html">← До бібліотеки</a>
        <p class="reader-layout-hint">Питання праворуч — гортайте вбік.</p>

        <section class="story-card">
          <div class="story-heading">
            <div>
              <p class="story-level" id="storyLevel"></p>
              <h1 class="story-title" id="storyTitle" tabindex="-1"></h1>
            </div>
            <button class="bookmark-button" id="bookmarkButton" type="button" aria-label="Додати в закладки">
              <span class="bookmark-icon" aria-hidden="true">☆</span>
            </button>
          </div>
          <div class="reader-toolbar">
            <div class="story-heading-actions">
              <div class="language-switch" role="group" aria-labelledby="languageSwitchLabel">
                <span class="reader-control-label" id="languageSwitchLabel">Переклад</span>
                <div class="segmented" id="translationLanguageSwitch">
                  <button class="segment" type="button" data-language="en" aria-label="English" aria-pressed="true">EN</button>
                  <button class="segment" type="button" data-language="de" aria-label="Deutsch" aria-pressed="false">DE</button>
                </div>
              </div>
              <button class="stress-toggle" id="stressToggle" type="button" role="switch" aria-checked="true">
                <span>Наголоси</span>
                <span class="switch" aria-hidden="true"></span>
              </button>
            </div>
          </div>
          <p class="story-speech-hint" id="storySpeechHint" hidden>
            Торкніться слова, щоб перекласти його.
          </p>
          <div class="story-content" id="storyContent" aria-busy="true">
            <div class="story-text" id="storyText">
              <p class="story-note">Завантажуємо текст…</p>
            </div>
            <div class="story-meta" id="storyMeta"></div>
          </div>
          <div
            class="selection-speech-popover"
            id="selectionSpeechPopover"
            role="group"
            aria-label="Дії з вибраним словом"
            hidden
          >
            <div class="selection-word-actions">
              <button
                class="selection-speech-button"
                id="selectionSpeechButton"
                type="button"
                aria-pressed="false"
              >
                <span class="selection-speech-icon" id="selectionSpeechIcon" aria-hidden="true">▶</span>
                <span id="selectionSpeechLabel">Прослухати</span>
              </button>
              <button
                class="selection-translate-button"
                id="selectionTranslateButton"
                type="button"
                aria-controls="selectionTranslationResult"
                aria-expanded="false"
              >
                <span aria-hidden="true">文</span>
                <span id="selectionTranslateLabel">Перекласти</span>
              </button>
            </div>
            <p class="selection-speech-unavailable" id="selectionSpeechUnavailable" hidden></p>
            <div
              class="selection-translation-result"
              id="selectionTranslationResult"
              hidden
            ></div>
          </div>
          <p
            class="visually-hidden"
            id="selectionSpeechStatus"
            role="status"
            aria-live="polite"
            aria-atomic="true"
          ></p>
        </section>

        <aside class="questions-card" aria-labelledby="questionsTitle">
          <h2 class="questions-title" id="questionsTitle" tabindex="-1">Перевірте розуміння</h2>
          <div class="questions-list" id="questionsList"></div>
          <div class="questions-footer">
            <p class="questions-status" id="questionsStatus" aria-live="polite" aria-atomic="true">Завантажуємо питання…</p>
            <div class="completion-actions" id="completionActions" hidden>
              <p class="completion-title">Що далі?</p>
              <button class="review-mistakes-button" id="reviewMistakesButton" type="button" hidden>Переглянути помилки</button>
              <a class="next-story-link" id="nextStoryLink" href="./index.html" hidden>Наступний текст</a>
              <a class="completion-back-link" href="./index.html">Повернутися до рівнів</a>
            </div>
            <button class="restart-button" id="restartButton" type="button" hidden>Почати тест знову</button>
          </div>
        </aside>
      </main>
    </div>

    <script src="./js/app/progress.js"></script>
    <script src="./js/data/stories.js"></script>
    <script src="./js/app/questions.js"></script>
    <script type="module" src="./js/app/story.js"></script>
    <script src="./js/app/version.js"></script>
  </body>
</html>
