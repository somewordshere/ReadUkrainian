<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Історії українською</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <main class="story-layout">
        <a class="back-link" href="./index.html">← Назад до всіх рівнів</a>

        <section class="story-card">
          <div class="story-heading">
            <div>
              <p class="story-level" id="storyLevel"></p>
              <h1 class="story-title" id="storyTitle"></h1>
            </div>
            <div class="story-heading-actions">
              <label class="translation-language-control" for="translationLanguageSelect">
                <span>Переклад</span>
                <select id="translationLanguageSelect" name="translationLanguage">
                  <option value="en">English</option>
                  <option value="de">Deutsch</option>
                </select>
              </label>
              <button class="bookmark-button" id="bookmarkButton" type="button" aria-label="Додати в закладки">
                <span class="bookmark-icon" aria-hidden="true">☆</span>
              </button>
            </div>
          </div>
          <p class="story-speech-hint" id="storySpeechHint" hidden>
            Виділіть одне українське слово, щоб перекласти його.
          </p>
          <div class="story-content" id="storyContent" aria-busy="true">
            <div class="story-text" id="storyText">
              <p class="story-note">Завантажуємо текст…</p>
            </div>
            <div class="story-meta" id="storyMeta"></div>
          </div>
          <div
            class="selection-speech-popover"
            id="selectionSpeechPopover"
            role="group"
            aria-label="Дії з вибраним словом"
            hidden
          >
            <div class="selection-word-actions">
              <button
                class="selection-speech-button"
                id="selectionSpeechButton"
                type="button"
                aria-pressed="false"
              >
                <span class="selection-speech-icon" id="selectionSpeechIcon" aria-hidden="true">▶</span>
                <span id="selectionSpeechLabel">Прослухати</span>
              </button>
              <button
                class="selection-translate-button"
                id="selectionTranslateButton"
                type="button"
                aria-controls="selectionTranslationResult"
                aria-expanded="false"
              >
                <span aria-hidden="true">文</span>
                <span id="selectionTranslateLabel">Перекласти</span>
              </button>
            </div>
            <p class="selection-speech-unavailable" id="selectionSpeechUnavailable" hidden></p>
            <div
              class="selection-translation-result"
              id="selectionTranslationResult"
              hidden
            ></div>
          </div>
          <p
            class="visually-hidden"
            id="selectionSpeechStatus"
            role="status"
            aria-live="polite"
            aria-atomic="true"
          ></p>
        </section>

        <aside class="questions-card" aria-labelledby="questionsTitle">
          <h2 class="questions-title" id="questionsTitle">Питання</h2>
          <div class="questions-list" id="questionsList"></div>
          <div class="questions-footer">
            <p class="questions-status" id="questionsStatus" aria-live="polite" aria-atomic="true">Завантажуємо питання…</p>
            <div class="completion-actions" id="completionActions" hidden>
              <p class="completion-title">Що далі?</p>
              <button class="review-mistakes-button" id="reviewMistakesButton" type="button" hidden>Переглянути помилки</button>
              <a class="next-story-link" id="nextStoryLink" href="./index.html" hidden>Наступний текст</a>
              <a class="completion-back-link" href="./index.html">Повернутися до рівнів</a>
            </div>
            <button class="restart-button" id="restartButton" type="button" hidden>Почати тест знову</button>
          </div>
        </aside>
      </main>
    </div>

    <script src="./js/app/progress.js"></script>
    <script src="./js/data/stories.js"></script>
    <script src="./js/data/a1-stories.js"></script>
    <script src="./js/data/a2-stories.js"></script>
    <script src="./js/data/b1-stories.js"></script>
    <script src="./js/app/questions.js"></script>
    <script src="./js/data/a1-questions.js"></script>
    <script src="./js/data/a2-questions.js"></script>
    <script src="./js/data/b1-questions.js"></script>
    <script type="module" src="./js/app/story.js"></script>
    <script src="./js/app/version.js"></script>
  </body>
</html>
